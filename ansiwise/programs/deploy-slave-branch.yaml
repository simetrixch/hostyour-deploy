# Cutting the install branch of a slave: a cluster that joins an installation that already exists.
#
# deploy-branch asks an operator nineteen questions, because it births an installation nothing has
# ever answered for. A slave is the opposite case: it belongs to the SAME installation as its
# master, and nearly everything about it is therefore already decided and already recorded — in the
# master's cluster map and in the master's own config file, both standing in the live checkout on
# this machine. This program asks TWO things nothing records, the slave's own domain and its stage,
# and reads the rest from those books. Asking any of it again would invite an answer that
# contradicts what stands written, and the contradiction would surface as two clusters of one
# installation disagreeing about their own apex.
#
# TWO CHECKOUTS, AND THE LINE BETWEEN THEM IS THE WHOLE SAFETY. /srv/hostyour-cloud is the LIVE
# checkout, standing on the master's own install branch — the branch that holds the books. This
# program only READS it: the master's map is copied out of its committed state, and the master's
# config is copied onto the new branch. Cutting the slave's branch THERE would yank the machine's
# working tree off the branch its reconciler and its installer stand on, so the cut happens in a
# second checkout, /srv/hostyour-cloud-slave, which the caller stands on the product branch —
# a clone with the same origin, kept for exactly this purpose.
#
# WHAT THE SLAVE'S BRANCH CARRIES, AND WHAT IT MUST NOT. One stage, one domain, one role — the same
# three facts deploy-branch stamps — plus the profile and config every chart's render and the
# installer read. It carries NO BOOKS: no cluster map and no registrations, its own included,
# because the books live on the branch of the cluster holding the master part and a second copy
# goes stale the moment the Manager writes to that one. The slave's own map is the Manager's
# to write, onto the books branch, where the per-slave generator reads it. That is why nothing here
# writes into clusters/ and why the commit does not name that directory.
#
# THE MAP IS COPIED TO A FIXED PATH FIRST, because the file is named for the master's domain — a
# name this program does not ask and must not guess. The copy row reads the branch name off the
# live checkout itself (the <branch> slot), and every later row that needs an installation-wide
# value reads it from the fixed copy: the catalog repository, the books branch, the build plane,
# the apex, the mail service. One read, one file, and the rows name their keys.
name: deploy-slave-branch
roles: [master]

# What SEVERAL rows below need the same value for, written once — deploy-branch's block WITHOUT its
# value_answer line, and the absence is load-bearing: a default is filled into every row that
# declares the argument, and half the stamps below read their value from the map's copy instead. A
# stamp handed an answer AND a file refuses the pair, so here every row that reads an answer names
# it itself.
defaults:
  keep_marker: set-domain:keep
  excluded_segments: [docs, scripts, templates]
  excluded_names: []
  script_suffixes: [.sh, .ps1]

answers:
  # ── the two facts no book records ───────────────────────────────────────────
  - name: fqdn
    kind: text
    shape: hostname
    denied: [example.invalid]
    describes: >-
      The domain name the slave answers on, for example s1.example.com. It becomes the name of the
      git branch this slave is generated on and the domain written into every manifest it deploys.
      It must be a real name you control the DNS for.

  - name: stage
    kind: text
    allowed: [dev, test, prod]
    describes: >-
      Which of the product's three stages the slave runs: dev, test or prod. Say it outright —
      nothing guesses it from the domain.

  # ── what follows from those two, or from what a slave IS ────────────────────
  # A slave's role is the word slave — that is what this program cuts — and the declaration pins it
  # so the value cannot be given as anything else. It is still an answer and not a bare argument,
  # because the stamp that writes it reads an answer by name, exactly as deploy-branch's does.
  - name: role
    kind: text
    required: false
    default: slave
    allowed: [slave]
    describes: >-
      What this branch is: a slave. Fixed here — a branch of any other role is deploy-branch's to
      cut, with the questions that role earns.

  - name: cluster_name
    kind: text
    required: false
    derived: first_dns_label_of
    from: fqdn
    describes: >-
      The first label of the slave's domain, which is the name its selectors and its auth mount are
      built from.

  # A slave never keeps the books — keeping them is what the master part IS — so this is the word
  # false, pinned. It exists as an answer because the profile render below fills a slot from it.

  # ALMOST always false, and stated rather than derived, because the one value it would be derived
  # from — the build plane's domain — is read from a file at run time and a derivation reads
  # answers. The exception it exists for: a slave sharing the build plane's machine under a second
  # domain, where the operator states true.

  # ── who the branch is committed as ──────────────────────────────────────────
  - name: committer_name
    kind: text
    required: false
    default_from: fqdn
    describes: >-
      The name every commit on the slave's branch is made under. Left unanswered it is the slave's
      own domain, so the history says which installation wrote it.

  - name: committer_email
    kind: text
    required: false
    default: installer@localhost
    describes: >-
      The mailbox those commits carry. The default names no real mailbox on purpose: the commit is
      made by a run on the master, for a machine that does not exist yet, and there is nobody it
      could honestly be. Give a real one to have the forge show it.

  # ── the registry accounts, the same two defaults deploy-branch declares ─────

steps:
  # The one tool this program is — deploy-branch's row.
  - step: require_commands
    commands: [git]
    on_failure: exit

  # THE MASTER'S MAP, copied out of the committed state of the branch the LIVE checkout stands on,
  # to a fixed path the rows below name. The file in the checkout is named for the master's domain,
  # which this program does not ask — the <branch> slot is how the row names it without knowing it.
  # Committed state and not the working copy, so debris of a failed run cannot travel onto the
  # slave's branch.
  - step: copy_branch_file
    repository: /srv/hostyour-cloud
    path: clusters/active/<branch>.yaml
    destination: /srv/hostyour-cloud-slave-map.yaml
    # THE DESTINATION IS IN /srv, WHICH ONLY root MAY WRITE. Whoever runs this program runs it as
    # the operator account, and that account creates nothing beside the checkouts — the write is
    # raised here, one row at a time, which is what this argument is for. Only the write: file_mode
    # 420 is 0644, so the four rows below that read this map back read it as themselves.
    elevated: true
    file_mode: 420
    on_failure: exit

  # The committer identity of the WORK checkout — a clone of its own, so the identity the live
  # checkout holds does not reach it. Local to the checkout, as deploy-branch's row is.
  - step: git_identity
    repository: /srv/hostyour-cloud-slave
    name_answer: committer_name
    email_answer: committer_email
    on_failure: exit

  # What a push from the work checkout is made with. Cloned with no credential in its remote
  # address like every other checkout this platform makes, so the gate below and the push at the
  # foot of this program both ask a remote for a write right that nothing granted.
  #
  # THE CREDENTIAL BELONGS TO THE LIVE CHECKOUT AND THE HELPER TO THE WORK ONE, which is the same
  # split every row of this program makes: the master's tree is read, the slave's branch is cut
  # somewhere else. This program asks for no credential of its own and must not start to — the
  # installation's writer already stands on this machine, in the file the master's own branch
  # program wrote.
  #
  # The <stage> of that path is filled from THIS run's stage, which is the slave's. That the
  # master's credentials file is named for the same stage is an assumption this program already
  # makes — the copy of configs/config.<stage> out of the live checkout below makes it too — so the
  # row inherits it rather than introducing it.
  - step: git_push_credential
    repository: /srv/hostyour-cloud-slave
    remote: origin
    credential_file: /srv/hostyour-cloud/secrets/secrets.<stage>
    credential_key: GITOPS_REPO_PAT
    credential_user: x-access-token
    run_answer: stage
    on_failure: exit

  # Whether the remote would take a push at all, proven before any of the work exists. The product
  # branch stands in for the slave's, exactly as it does in deploy-branch: the slave's branch does
  # not exist yet, so it is the one branch that cannot be offered.
  #
  # IT DOES NOT ANSWER ON ITS OWN: the credential it presents is written by the row above, and a
  # dry run writes nothing, so in a dry run this gate cannot be reached and the record stamps it
  # declared rather than proven. A real run enforces it in full.
  - step: require_pushable_remote
    rests_on_an_earlier_step: true
    repository: /srv/hostyour-cloud-slave
    remote: origin
    branch: master
    on_failure: exit

  # The cut. The work checkout must be STANDING on the product branch — a checkout standing
  # anywhere else is refused rather than moved, which is also what keeps this row from ever cutting
  # in the live checkout by mistake: that one stands on the master's branch.
  - step: git_branch
    repository: /srv/hostyour-cloud-slave
    base: master
    name_answer: fqdn
    on_failure: exit

  # THE INSTALLATION'S CONFIG, inherited whole from the master's branch — the two mailboxes, the
  # alert recipients, the apex, the build plane, the catalog, every toggle an operator set. Copied
  # AFTER the cut, so it lands on the slave's branch: copied before it, the dirty tree would refuse
  # the cut itself.
  - step: copy_branch_file
    repository: /srv/hostyour-cloud
    path: configs/config.<stage>
    destination: /srv/hostyour-cloud-slave/configs/config.<stage>
    file_mode: 420
    run_answer: stage
    on_failure: exit

  # The three values of that file that name a MACHINE, overwritten with the slave's own. This is
  # the row where the answer wins over what the copy carried: the master's domain stood there, and
  # a slave that kept it would install itself as its own master. Everything not named here keeps
  # the master's value, which is the inheritance.
  - step: fill_key_value_file
    template_path: /srv/hostyour-cloud-slave/configs/config.example
    path: /srv/hostyour-cloud-slave/configs/config.<stage>
    run_answer: stage
    file_mode: 420
    subject: configuration
    values:
      DEPLOY_ENV: { answer: stage }
      CLUSTER_FQDN: { answer: fqdn }
    on_failure: exit

  # ── the stamps, deploy-branch's rows pointed at the work checkout ───────────
  # The domain the source branch carries in place of an installation's own, anywhere in the checkout.
  - step: stamp_placeholder_in_tracked_files
    repository: /srv/hostyour-cloud-slave
    refuse_on_branch: master
    placeholder: example.invalid
    value_answer: fqdn
    on_failure: exit

  - step: stamp_placeholder_in_tracked_files
    repository: /srv/hostyour-cloud-slave
    refuse_on_branch: master
    placeholder: __CLUSTER_NAME__
    value_answer: cluster_name
    tree: clusters/bootstrap
    on_failure: exit

  # The SHORT name of the cluster that keeps the books, worked out of the map's recorded
  # booksCluster by the framework's own derivation rule — recorded nowhere, because a map that also
  # recorded its short name would be the same fact twice.
  - step: stamp_placeholder_in_tracked_files
    repository: /srv/hostyour-cloud-slave
    refuse_on_branch: master
    placeholder: __BOOKS_NAME__
    value_file: /srv/hostyour-cloud-slave-map.yaml
    value_key: booksCluster
    value_rule: first_dns_label_of
    tree: clusters/bootstrap
    on_failure: exit

  # The relay's own per-branch values, from the same two recorded facts. The slave's toggles decide
  # whether a relay runs here at all; the file is the branch's either way, and a branch without it
  # would refuse the render of the one app that requires it the day somebody turns it on.
  - step: write_file_from_template
    template: ansiwise/templates/postfix-values.tpl
    path: /srv/hostyour-cloud-slave/installation/values/postfix.yaml
    file_mode: 420
    values:
      platform-domain: { file: /srv/hostyour-cloud-slave-map.yaml, key: platformDomain }
      unit-apex: { file: /srv/hostyour-cloud-slave-map.yaml, key: unitApex }
    on_failure: exit

  # WHAT THIS RUN WROTE, RECORDED — and clusters/ is NOT recorded whole: a slave
  # branch carries no books, its own map included. The map the Manager composes for this slave
  # goes onto the books branch, where the per-slave generator reads it.
  - step: git_commit
    repository: /srv/hostyour-cloud-slave
    paths: [configs, installation, clusters/argocd, clusters/bootstrap]
    message: "Generate this slave from the two answers and the master's books"
    on_failure: exit

  - step: git_push
    repository: /srv/hostyour-cloud-slave
    remote: origin
    on_failure: exit
