# Bringing one EXISTING SLAVE install branch to the release its cluster map is pinned to.
#
# regenerate-branch is this operation for a cluster that keeps the books: it stands on the branch it
# regenerates, reads the pin out of the map on that same branch, and merges the tag into the checkout
# it is standing in. A slave has none of those three things. Its branch carries no cluster map and no
# books at all — deploy-slave-branch cuts it that way, because the books live on the branch of the
# cluster holding the master part and a second copy goes stale the moment the Manager writes to
# that one — so nothing on a slave's own branch states a pin to regenerate at.
#
# SO THIS PROGRAM RUNS ON THE MASTER, and it is deploy-slave-branch's shape with a merge where the
# cut was. It reads the pin and the books off the LIVE checkout, which stands on the master's own
# branch, and does every write in the WORK checkout, which the caller stands on the SLAVE's branch.
#
# TWO CHECKOUTS, AND THE LINE BETWEEN THEM IS THE WHOLE SAFETY. /srv/hostyour-cloud is the LIVE
# checkout, standing on the master's own install branch — the branch that holds the books. This
# program only READS it: the slave's map is read for the pin, and the master's map is copied out of
# its committed state for the installation-wide values. Merging into the slave's branch THERE would
# yank the machine's working tree off the branch its reconciler and its installer stand on, so every
# write happens in the second checkout, /srv/hostyour-cloud-slave, which the caller stands on the
# slave's branch — a clone with the same origin, kept for exactly this purpose.
#
# THE PIN IS READ, NEVER ASKED, and it is read off ANOTHER cluster's map. The release a slave stands
# on is recorded in clusters/active/<its own fqdn>.yaml on the MASTER's branch, so the file is named
# for one cluster and carried on the branch of another: the row below names it with the <fqdn> slot
# and fills it from this run's own answer. An operator re-typing the tag here could type any tag at
# all, and the record and the branch would then disagree about what the slave runs.
#
# THE DANGER OF THIS OPERATION IS WHAT THE BRANCH ALONE HAS, and the merge is shaped around it,
# exactly as regenerate-branch's is: the branch is MERGED forward and never reset, so everything only
# the branch has is kept, everything only the tag has comes in, and exactly the overlaps stop as
# conflicts. Which conflicts may resolve toward the tag is the same declaration, copied from the same
# same paths the rows below regenerate.
#
# THE MAP IS COPIED TO A FIXED PATH, because the master's map is named for the master's domain — a
# name this program does not ask and must not guess. The copy row reads the branch name off the live
# checkout itself (the <branch> slot), and every later row that needs an installation-wide value
# reads it from the fixed copy: the catalog repository, the books branch, the build plane, the apex,
# the mail service. One read, one file, and the rows name their keys.
name: regenerate-slave-branch
roles: [master]

# What SEVERAL rows below need the same value for, written once — deploy-slave-branch's block, and
# its missing value_answer line is load-bearing there and here: a default is filled into every row
# that declares the argument, and half the stamps below read their value from the map's copy
# instead. A stamp handed an answer AND a file refuses the pair, so every row that reads an answer
# names it itself.
defaults:
  keep_marker: set-domain:keep
  excluded_segments: [docs, scripts, templates]
  excluded_names: []
  script_suffixes: [.sh, .ps1]

answers:
  # ── the two facts no book records ───────────────────────────────────────────
  - name: fqdn
    kind: text
    shape: hostname
    denied: [example.invalid]
    describes: >-
      The domain name the slave answers on, which is the name of the branch being regenerated and
      the name of the slave's own cluster map on the master's branch. The work checkout at
      /srv/hostyour-cloud-slave must be standing on this branch.

  - name: stage
    kind: text
    allowed: [dev, test, prod]
    describes: >-
      Which of the product's three stages the slave runs: dev, test or prod — the same value the
      branch was cut with. Nothing guesses it from the domain.

  # ── what follows from those two, or from what a slave IS ────────────────────
  - name: role
    kind: text
    required: false
    default: slave
    allowed: [slave]
    describes: >-
      What this branch is: a slave. Fixed here — a branch of any other role is regenerated by
      regenerate-branch, out of the checkout standing on it.

  - name: cluster_name
    kind: text
    required: false
    derived: first_dns_label_of
    from: fqdn
    describes: >-
      The first label of the slave's domain, which is the name its selectors and its auth mount are
      built from.


  # ── who the regenerated branch is committed as ──────────────────────────────
  - name: committer_name
    kind: text
    required: false
    default_from: fqdn
    describes: >-
      The name every commit on the slave's branch is made under. Left unanswered it is the slave's
      own domain, so the history says which installation wrote it.

  - name: committer_email
    kind: text
    required: false
    default: installer@localhost
    describes: >-
      The mailbox those commits carry. The default names no real mailbox on purpose: the commit is
      made by a run on the master, for a machine of its own. Give a real one to have the forge show
      it.

  # ── the registry accounts, the same two defaults every branch program declares ─

steps:
  # The one tool this program is — deploy-slave-branch's row.
  - step: require_commands
    commands: [git]
    on_failure: exit

  # THE PIN, read off the SLAVE's map on the MASTER's branch. The file is named for the slave and
  # carried on the branch the live checkout stands on, which is the pair of names regenerate-branch
  # never has to tell apart: <fqdn> is this run's own answer, and the row after this one takes the
  # value as a measurement. A slave nothing has ever released records no `release` line, and this row
  # refuses then — a regeneration without a pin would be deploy-slave-branch at the tip wearing a
  # safer name.
  - step: measure_value_in_branch_file
    repository: /srv/hostyour-cloud
    path: clusters/active/<fqdn>.yaml
    key: release
    run_answer: fqdn
    on_failure: exit

  # THE MASTER'S MAP, copied out of the committed state of the branch the LIVE checkout stands on,
  # to a fixed path the rows below name — deploy-slave-branch's row, for the same reason: the file
  # is named for the master's domain, which this program does not ask, and the <branch> slot is how
  # the row names it without knowing it. Committed state and not the working copy, so debris of a
  # failed run cannot travel onto the slave's branch.
  - step: copy_branch_file
    repository: /srv/hostyour-cloud
    path: clusters/active/<branch>.yaml
    destination: /srv/hostyour-cloud-slave-map.yaml
    # RAISED FOR THE SAME REASON deploy-slave-branch's identical row is: the destination is in /srv,
    # which only root may write, and whoever runs this program runs it as the operator account. The
    # write is raised one row at a time; file_mode 420 is 0644, so the rows below read this map back
    # as themselves.
    elevated: true
    file_mode: 420
    on_failure: exit

  # The committer identity of the WORK checkout — a clone of its own, so the identity the live
  # checkout holds does not reach it. Local to the checkout, as every branch program's row is.
  - step: git_identity
    repository: /srv/hostyour-cloud-slave
    name_answer: committer_name
    email_answer: committer_email
    on_failure: exit

  # What a push from the work checkout is made with. Cloned with no credential in its remote
  # address like every other checkout this platform makes, so the gate below and the push at the
  # foot of this program both ask a remote for a write right that nothing granted.
  #
  # THE CREDENTIAL BELONGS TO THE LIVE CHECKOUT AND THE HELPER TO THE WORK ONE, which is the same
  # split every row of this program makes: the master's tree is read, the slave's branch is moved
  # somewhere else. This program asks for no credential of its own and must not start to — the
  # installation's writer already stands on this machine, in the file the master's own branch
  # program wrote.
  #
  # The <stage> of that path is filled from THIS run's stage, which is the slave's, and that the
  # master's credentials file is named for the same stage is an assumption this program already
  # makes elsewhere rather than one this row introduces.
  - step: git_push_credential
    repository: /srv/hostyour-cloud-slave
    remote: origin
    credential_file: /srv/hostyour-cloud/secrets/secrets.<stage>
    credential_key: GITOPS_REPO_PAT
    credential_user: x-access-token
    run_answer: stage
    on_failure: exit

  # Whether the remote would take the result, asked before any of the result exists. The branch a
  # push has to be accepted for is the SLAVE's own — deploy-slave-branch offers the product branch
  # because the slave's does not exist yet, and a regeneration proves the branch it is about to move.
  #
  # IT DOES NOT ANSWER ON ITS OWN: the credential it presents is written by the row above, and a
  # dry run writes nothing, so in a dry run this gate cannot be reached and the record stamps it
  # declared rather than proven. A real run enforces it in full.
  - step: require_pushable_remote
    rests_on_an_earlier_step: true
    repository: /srv/hostyour-cloud-slave
    remote: origin
    branch_answer: fqdn
    on_failure: exit

  # THE REGENERATION ITSELF: the pinned tag merged into the slave's branch, which the work checkout
  # is standing on — the merge refuses to run while any other branch is checked out rather than
  # moving the checkout, which is also what keeps this row from ever merging into the live checkout's
  # branch by mistake. Everything only the branch has is kept; everything only the tag has comes in;
  # and a conflict is resolved toward the tag ONLY under the paths listed here, because the rows
  # below write every one of them again. The list stands on that row and nowhere else,
  # the same copy regenerate-branch carries; every conflict outside it stops the run with the paths
  # named.
  - step: git_merge_ref
    repository: /srv/hostyour-cloud-slave
    branch_answer: fqdn
    ref: {measured: value}
    toward_ref:
      - clusters/argocd/*
      # PATTERNS, and the same reason the master regeneration states: the nine names this
      # list carried pointed at a directory that does not exist, so the file a slave
      # regeneration rewrites whole was the one a conflict would stop the run on.
      - clusters/active/*
      - installation/values/*
    on_failure: exit

  # ── from here down, deploy-slave-branch's own rows, unchanged ───────────────
  # Each finds the work the merge left it: a placeholder that came back in from the tag is stamped
  # again, a file rendered from the master's books is rendered again, and a row whose work survived
  # the merge finds nothing to do. The full story of every row stands beside it in
  # deploy-slave-branch.yaml, and this file deliberately does not restate it: two copies of one
  # paragraph drift.

  # THE INSTALLATION'S CONFIG, inherited whole from the master's branch on every regeneration, so a
  # toggle the master gained since the cut reaches the slave. Copied AFTER the merge, so a dirty tree
  # cannot refuse the merge itself.
  - step: copy_branch_file
    repository: /srv/hostyour-cloud
    path: configs/config.<stage>
    destination: /srv/hostyour-cloud-slave/configs/config.<stage>
    file_mode: 420
    run_answer: stage
    on_failure: exit

  # The three values of that file that name a MACHINE, overwritten with the slave's own: the
  # master's domain stood there, and a slave that kept it would install itself as its own master.
  - step: fill_key_value_file
    template_path: /srv/hostyour-cloud-slave/configs/config.example
    path: /srv/hostyour-cloud-slave/configs/config.<stage>
    run_answer: stage
    file_mode: 420
    subject: configuration
    values:
      DEPLOY_ENV: { answer: stage }
      CLUSTER_FQDN: { answer: fqdn }
    on_failure: exit

  # ── the stamps, deploy-slave-branch's rows pointed at the work checkout ─────
  - step: stamp_placeholder_in_tracked_files
    repository: /srv/hostyour-cloud-slave
    refuse_on_branch: master
    placeholder: example.invalid
    value_answer: fqdn
    on_failure: exit

  - step: stamp_placeholder_in_tracked_files
    repository: /srv/hostyour-cloud-slave
    refuse_on_branch: master
    placeholder: __CLUSTER_NAME__
    value_answer: cluster_name
    tree: clusters/bootstrap
    on_failure: exit

  - step: stamp_placeholder_in_tracked_files
    repository: /srv/hostyour-cloud-slave
    refuse_on_branch: master
    placeholder: __BOOKS_NAME__
    value_file: /srv/hostyour-cloud-slave-map.yaml
    value_key: booksCluster
    value_rule: first_dns_label_of
    tree: clusters/bootstrap
    on_failure: exit

  - step: write_file_from_template
    template: ansiwise/templates/postfix-values.tpl
    path: /srv/hostyour-cloud-slave/installation/values/postfix.yaml
    file_mode: 420
    values:
      platform-domain: { file: /srv/hostyour-cloud-slave-map.yaml, key: platformDomain }
      unit-apex: { file: /srv/hostyour-cloud-slave-map.yaml, key: unitApex }
    on_failure: exit

  # What the stamps and renders changed on top of the merge, recorded — the merge commit itself was
  # already made by the merge row. clusters/ is NOT recorded whole: a slave branch
  # carries no books, its own map included. The map this slave is pinned in stands on the books
  # branch, where this program read it. What a slave DOES carry under clusters/ is named one by
  # one instead — the reconciler's own declarations and what is applied before it exists.
  - step: git_commit
    repository: /srv/hostyour-cloud-slave
    paths: [configs, installation, clusters/argocd, clusters/bootstrap]
    message: "Regenerate this slave at the release its map on the master records"
    on_failure: exit

  # And sent — a plain push, because a merge keeps the history and nothing is rewritten.
  - step: git_push
    repository: /srv/hostyour-cloud-slave
    remote: origin
    on_failure: exit
