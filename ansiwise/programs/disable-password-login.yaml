# Closing the password door, once the key door is known to work.
#
# ITS OWN PROGRAM ON PURPOSE. The machine cannot prove that the operator's key login works — the
# private half is on their laptop and never comes here. So the proof is theirs: they connect with
# the key, and only then do they run this.
#
# A program that installed the key and took the password away in one pass would be a program that
# locks somebody out of a machine they can no longer reach, and no gate on this machine could catch
# it. That is why deploy-host stops at the key and this is a second, deliberate act.
name: disable-password-login
roles: [master, slave]
steps:
  # THE TOOLS FIRST, AND THIS ONLY MEASURES. A program that quietly installed what it was missing
  # would be a program whose dry run lied: it showed a plan that did not include the installation it
  # was about to perform. Installing is its own step, in deploy-host, and keeping the two apart is
  # what lets a dry run say what would be installed without installing it.
  #
  # These three are what the two steps below start. `sshd` is asked what the daemon would accept and
  # `getent` reads the account; `stat` reads the mode of the key file, because a key readable by
  # anybody is a key the daemon refuses.
  - step: require_commands
    commands: [sshd, getent, stat]
    on_failure: exit

  # Re-checked here rather than trusted from the earlier run: this program may be run days later,
  # against a machine somebody has touched in between.
  - step: require_key_login_possible
    # WHICH key, named by the row. The step takes a key either from an answer or from a value a
    # row of the same run measured, and it refuses a row that says neither — so the program that
    # asks a person for their key is the one that names the answer holding it.
    public_key_answer: operator_public_key
    on_failure: exit

  - step: disable_password_login
    drop_in: /etc/ssh/sshd_config.d/50-hostyour-cloud.conf
    # This path belongs to root, so reading and writing it is elevated.
    elevated: true
    on_failure: exit

# The same two questions deploy-host asked, under the same names, because this re-checks what that
# program did. A key written into this file instead would be a key nobody holds, and this program
# would confirm it and then take the password away.
answers:
  - name: operator_user
    kind: text
    describes: >-
      The account you reach this machine as. It is about to become the only way in, so answer with
      the account you have just connected as by key — not the one you intended to.

  - name: operator_public_key
    kind: text
    describes: >-
      The PUBLIC key you have just proven you can connect with, as one line of an authorized_keys
      file. This program refuses to switch the password off unless sshd would accept exactly this
      key for that account.
