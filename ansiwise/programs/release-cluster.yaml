# Pinning one installation to one release of the platform.
#
# THE SECOND HALF OF A RELEASE, and the one that decides anything. release-platform cuts a tag; a
# tag nobody has pinned anything to changes nothing anywhere, which is the point of keeping the two
# apart — which cluster follows which release is a decision per cluster, never a consequence of a
# tag existing.
#
# WHAT THIS WRITES AND WHAT READS IT. One line, `release:`, in this cluster's own map at
# `clusters/active/<fqdn>.yaml`. That field is THE pin: regenerate-branch reads it off the branch
# itself and merges exactly that ref, so the field and the branch state are one statement and "this
# cluster runs platform X" is a question with an answer. Nothing else may write it — a second writer
# is what lets a map drift away from the branch it describes.
#
# THE ORDER IS PIN, THEN REGENERATE, and they are separate runs on purpose. Between them an operator
# can read what the pin now says and stop. A program that did both would move a cluster onto a new
# tree as a side effect of recording a number.
#
#   ansiwise release-cluster --role master --mode dry --answers <file>
#   ansiwise release-cluster --role master --mode run --answers <file>
#   ansiwise regenerate-branch --role master --mode run --answers <file>
#
# A TAG THAT NAMES NO TREE IS NOT CAUGHT HERE, and this program says so rather than implying
# otherwise. What is written is text; whether the platform repository carries a tag of that name is
# asked by regenerate-branch, whose merge refuses with "nothing resolves <ref> to a commit". So a
# typo here is caught at the next step and never silently regenerates anything — but it does stand
# in the map until then, which is why the run record and the pushed commit both name it.
name: release-cluster
roles: [master]

answers:
  - name: fqdn
    kind: text
    describes: >-
      The public domain name of this installation, which is also the name of its install branch and
      of its own map under clusters/active.

  - name: stage
    kind: text
    describes: >-
      Which stage this installation is, and the word every "<stage>" in a credential path below
      stands for.

  - name: release
    kind: text
    describes: >-
      The release this installation is to follow, as the whole tag — major.minor.patch-channel-stamp
      — exactly as release-platform cut it. Written into the map as it stands here, so a tag that
      names no tree stands there until the regeneration refuses it.

  - name: committer_name
    kind: text
    describes: The name the commit recording the pin carries.

  - name: committer_email
    kind: text
    describes: The mailbox that commit carries.

  - name: platform_repo_write_pat
    kind: text
    required: false
    describes: >-
      What a push to the installation repository is made with. Optional, and for the same reason
      regenerate-branch's is: the file it seeds already stands on the machine, filled at birth, and
      the value that is actually correct for this machine is the one in that file.

steps:
  - step: require_commands
    commands: [git]
    on_failure: exit

  - step: git_identity
    repository: /srv/hostyour-cloud
    name_answer: committer_name
    email_answer: committer_email
    on_failure: exit

  # THE FILE AND NOT THE ANSWER, regenerate-branch's row: on a machine that already stands, the
  # credential is the one in the file rather than one somebody re-typed into this run.
  - step: git_push_credential
    repository: /srv/hostyour-cloud
    remote: origin
    credential_file: /srv/hostyour-cloud/secrets/secrets.<stage>
    credential_key: GITOPS_REPO_PAT
    credential_user: x-access-token
    run_answer: stage
    on_failure: exit

  # Asked before any of the result exists: a pin that cannot be pushed is a pin only this machine
  # believes, and everything that reads it reads the branch.
  - step: require_pushable_remote
    rests_on_an_earlier_step: true
    repository: /srv/hostyour-cloud
    remote: origin
    branch_answer: fqdn
    on_failure: exit

  # THE PIN. The path is named for this installation rather than for the branch, because the same
  # row pins a cluster whose map is kept here and whose branch is somewhere else.
  - step: write_value_in_branch_file
    rests_on_an_earlier_step: true
    repository: /srv/hostyour-cloud
    path: clusters/active/<fqdn>.yaml
    key: release
    value_answer: release
    run_answer: fqdn
    # The map is read by everything that has to tell one installation from another, so it is a file
    # anyone on the machine may read.
    file_mode: 420
    on_failure: exit

  # ONLY THE MAPS, by name. A blanket record would sweep up whatever else stands in this checkout —
  # a rendered value somebody was looking at, a credential file mid-rotation.
  - step: git_commit
    rests_on_an_earlier_step: true
    repository: /srv/hostyour-cloud
    paths: [clusters]
    message: the release this installation follows
    on_failure: exit

  - step: git_push
    rests_on_an_earlier_step: true
    repository: /srv/hostyour-cloud
    remote: origin
    on_failure: exit
