# Bringing one EXISTING installation branch to a named state of the product tree.
#
# deploy-branch cuts a branch from the tip of the product branch and is run once, at birth. This
# program is the operation for every day after that: master moves, and the branch does not follow
# until somebody regenerates it — deliberately, and at exactly the state they name.
#
# WHY THE BRANCH CANNOT SIMPLY BE MERGED. Part of what a branch carries is STAMPED: the files under
# clusters/bootstrap, and clusters/argocd/root-app.yaml, have this installation's own domain and
# name written into them where the product tree carries markers. Merging the product's copy would
# put those markers back into files helm and kubectl apply literally, before the reconciler that
# could render them exists. So the merge is followed by every stamp the birth ran, over the same
# files.
#
# THE STATE IS NAMED BY WHOEVER RUNS THIS. Reading it off the `release` line of the cluster's own
# map is no use: no run writes that line, and a program whose only source of a value is a line
# nobody fills is a program nobody can run. Naming it is the person's act, the same act as the
# merge they would otherwise do by hand, and the run's own record says what they named.
#
# THE DANGER OF THIS OPERATION IS THE BOOKS, and the merge is shaped around it. An install branch
# holds two kinds of bytes: what came from the product at the last pin, and what was written onto
# the branch afterwards — above all the books, the registrations and cluster maps only this
# installation has. A regeneration that reset the branch to the tag would destroy them wholesale.
# So the branch is MERGED forward instead: everything only the branch has is kept, everything only
# the tag has comes in, and exactly the overlaps stop as conflicts.
#
# WHICH CONFLICTS MAY RESOLVE TOWARD THE TAG is declared on the merge row, and the declaration is
# stated on that row and nowhere else: the paths listed there are regenerated by the stamp and
# render rows BELOW the merge, so whatever the merge takes, a later row writes it again a moment
# later. Every conflict outside that list stops the run with the paths named — a book, an
# operator's toggle, a hand edit — because nothing here writes those again and only a person can
# say which decision stands. Adding a row below that regenerates a path means adding that path to
# the merge row, or the run stops on a conflict it would have overwritten anyway.
#
# EVERYTHING AFTER THE MERGE IS deploy-branch's OWN ROW, unchanged, and that is the point: a
# regeneration is deploy-branch run against an existing installation. The stamps find the tag's
# placeholders where a conflict resolved toward it and stamp them again; the map and the profile
# are rewritten from this run's answers as they are on every run, with the release line carried
# through the map's own carried slot; the credential files are create-only per key, so what the
# machine already holds is kept and the credential answers below may simply not be given.
#
# A CLUSTER THAT KEEPS ITS OWN BOOKS, and no other. A slave's branch carries no cluster map at all,
# so the rows below that read and rewrite `clusters/active/<branch>.yaml` name a file nothing on
# that branch has; a slave's map stands on the MASTER's branch under the slave's own name, which is
# a second axis they do not reach. regenerate-slave-branch is that operation, run on the master out
# of two checkouts, and it is why the roles line names one role and not two.
name: regenerate-branch
roles: [master]

# What SEVERAL rows below need the same value for, written once — the same block deploy-branch
# carries, because these rows are its rows.
defaults:
  value_answer: fqdn
  keep_marker: set-domain:keep
  excluded_segments: [docs, scripts, templates]
  excluded_names: []
  script_suffixes: [.sh, .ps1]

answers:
  # ── what this installation is ───────────────────────────────────────────────
  # The same declarations deploy-branch asks at birth, re-supplied here because the rows they feed
  # run again. The exceptions are the credentials at the end: on an existing installation the files
  # they seeded already hold them, the rows that write them never rewrite a filled key, and so they
  # are optional here — an answer given fills only a key that is still empty.
  - name: platform_ref
    kind: text
    describes: >-
      The state of the product tree this run brings the branch to — a tag or a commit, named by
      whoever runs it. It is fetched and merged, and the stamps below then write this
      installation's own answers back over everything the merge brought in, which is what keeps a
      branch an installation and not a copy of the trunk.

  - name: platform_repo
    kind: text
    describes: >-
      The product repository this installation's branch stands in, as owner/name. The row that puts
      the checkout on the published tip of its own branch names it, the same way deploy-host does at
      an installation's birth.

  - name: letsencrypt_server
    kind: text
    describes: >-
      The certificate authority this installation registers with, written as the address of its
      directory. Every installation of this platform answers
      https://acme-v02.api.letsencrypt.org/directory; a provider whose authority is a different one
      names that instead. Never a staging service: its certificates are signed by a root no machine
      carries, so an installation that answers one cannot reach its own secret store.



  # ── the credentials a third party issues ────────────────────────────────────
  # None of these can be generated or derived. Each is obtained once, from GitHub, from Cloudflare
  # or from Hetzner, and this run is the only way it reaches the machine.

  - name: fqdn
    kind: text
    shape: hostname
    denied: [example.invalid]
    describes: >-
      The domain name this cluster answers on, which is the name of the branch being regenerated,
      the name of its cluster map, and the domain every stamp below writes. The checkout at
      /srv/hostyour-cloud must be standing on this branch.

  - name: stage
    kind: text
    allowed: [dev, test, prod]
    describes: >-
      Which of the product's three stages this installation runs: dev, test or prod — the same
      value the branch was cut with. Nothing guesses it from the domain.

  - name: role
    kind: text
    allowed: [master, slave, master+slave]
    describes: >-
      Every part this cluster carries — "master", "slave", or "master+slave" where one machine does
      both jobs. Adding the slave part to a machine that held the master part alone is done by
      regenerating with "master+slave"; a role that DROPS the master part is not: the books stand
      on the master's branch, and this regeneration must carry them through unharmed.

  - name: books_fqdn
    kind: text
    # HELD TO A SHAPE, the same one `fqdn` above is held to. Every one of these lands in
    # clusters/active/<fqdn>.yaml, and a value that is not a name makes that file state
    # something no chart can read — checked when the answers are read, before the first step
    # and before any machine is asked anything, so the refusal names this answer rather than a
    # chart render three programs later.
    shape: hostname
    required: false
    default_from: fqdn
    describes: >-
      The domain of the cluster that keeps the books. Leave it empty where this cluster keeps them
      itself; write the other cluster's domain where it does not.

  - name: cluster_name
    kind: text
    required: false
    derived: first_dns_label_of
    from: fqdn
    describes: >-
      The first label of this cluster's domain, which is the name its auth mount and its selectors
      are built from.

  - name: holds_books
    kind: text
    required: false
    derived: same_as
    from: books_fqdn
    and: fqdn
    describes: >-
      Whether the cluster keeping the books is this one, as the word true or the word false, for
      the charts that decide between an in-cluster service and a public name.

  - name: books_name
    kind: text
    required: false
    derived: first_dns_label_of
    from: books_fqdn
    describes: >-
      The first label of the books-keeping cluster's domain, which is what a dashboard and a
      kubeconfig context are named after.

  - name: holds_build_plane
    kind: text
    required: false
    derived: same_as
    from: build_plane_fqdn
    and: fqdn
    describes: >-
      Whether the cluster carrying the build plane is this one, as the word true or the word false.

  - name: build_plane_fqdn
    kind: text
    # HELD TO A SHAPE, the same one `fqdn` above is held to. Every one of these lands in
    # clusters/active/<fqdn>.yaml, and a value that is not a name makes that file state
    # something no chart can read — checked when the answers are read, before the first step
    # and before any machine is asked anything, so the refusal names this answer rather than a
    # chart render three programs later.
    shape: hostname
    describes: >-
      The domain of the cluster whose image registry and builders this installation pulls from —
      the same value the branch was cut with.

  - name: unit_apex
    kind: text
    # HELD TO A SHAPE, the same one `fqdn` above is held to. Every one of these lands in
    # clusters/active/<fqdn>.yaml, and a value that is not a name makes that file state
    # something no chart can read — checked when the answers are read, before the first step
    # and before any machine is asked anything, so the refusal names this answer rather than a
    # chart render three programs later.
    shape: hostname
    describes: >-
      The public apex the consumers and tenants of this installation are reached below, as
      <name>.<apex> — the same value the branch was cut with.

  - name: platform_domain
    kind: text
    # HELD TO A SHAPE, the same one `fqdn` above is held to. Every one of these lands in
    # clusters/active/<fqdn>.yaml, and a value that is not a name makes that file state
    # something no chart can read — checked when the answers are read, before the first step
    # and before any machine is asked anything, so the refusal names this answer rather than a
    # chart render three programs later.
    shape: hostname
    describes: >-
      The business domain of this installation — the sender identity its mail is derived from and
      the sender allowlist of its mail relay.

  - name: alert_recipients
    kind: text_list
    # HELD TO A SHAPE. This answer's own description already says "at least one real address",
    # and nothing enforced it: an alert route that resolves to nobody stops the render of the
    # whole observability app, and that failure names the route rather than the answer. Checked
    # when the answers are read now, before the first step.
    shape: mailbox
    describes: >-
      The mailboxes this installation's platform alerts are sent to. At least one real address.

  - name: catalog_repo
    kind: text
    describes: >-
      The GitHub repository holding this installation's tenant charts and their per-stage pins,
      written as owner/name. It is NOT the repository the deployment programs are read from —
      that one is deploy_repo, below.

  # THE REPOSITORY THE PROGRAMS THEMSELVES COME FROM, which is the platform's and not this
  # installation's. It is public, so no credential stands beside it; that is the whole difference
  # from catalog_repo above, which holds an installation's own charts and is reached with one.
  - name: deploy_repo
    kind: text
    default: simetrixch/hostyour-deploy
    describes: >-
      The GitHub repository the deployment programs are read from, written as owner/name. It is
      the platform's own and public, so the default is the right answer unless this installation
      runs programs of its own.

  - name: mail_url
    kind: text
    required: false
    describes: >-
      The address of this installation's own mail service, if it runs one. Leave empty when it has
      none.

  # ── who the regenerated branch is committed as ──────────────────────────────
  - name: operator_user
    kind: text
    describes: >-
      The account that operates this machine. The Manager reaches this machine as it, over SSH to
      its own host, and naming it is what turns on the Manager's registration of this cluster and
      the repository credential its consumer onboarding needs. It is the same account deploy-host was
      given under this name.

  - name: lan_host
    kind: text
    describes: >-
      The address this machine answers on inside the network it shares with the clusters of this
      installation, as an IPv4 address, for example 10.1.1.5. The Manager serves on the node's own
      network, so this is also the address its chart-validation gate has to prove it cannot reach
      from inside the fence — which is why an address and not a name.

  - name: committer_name
    kind: text
    required: false
    default_from: fqdn
    describes: >-
      The name every commit on this installation's branch is made under. Left unanswered it is the
      installation's own domain.

  - name: committer_email
    kind: text
    describes: >-
      The mailbox those commits carry. A forge shows it beside every commit and some refuse a push
      without one.

  - name: cluster_issuer
    kind: text
    allowed: [platform-acme, platform-local]
    default: platform-local
    describes: >-
      Which authority this installation's certificates are issued by, named rather than asserted.
      `platform-acme` is the public one, whose root every browser, operating system and container
      image already carries. `platform-local` is one the cluster mints for itself: nothing outside
      this installation trusts it and no request ever leaves the machine, which is what lets an
      installation be built and rebuilt as often as it needs to be, against an authority that counts
      how many certificates it has issued. It is a NAME because the certificate service watches the
      name a certificate is issued by and never the specification behind it - so changing the name is
      what makes it issue everything again.

  - name: letsencrypt_email
    kind: text
    required: false
    describes: >-
      A real mailbox Let's Encrypt sends certificate expiry and policy notices to. Optional here
      because the config file of an existing installation already carries it, and a filled key is
      never rewritten from a value nobody gave.

  # ── the credentials a third party issues ────────────────────────────────────
  # All optional on a regeneration: the files they seed stand on the machine already, filled at
  # birth or rotated by hand since, and the rows below never rewrite a filled key from an absent
  # answer. Give one only to fill a key that is still empty.
  - name: platform_repo_write_pat
    kind: text
    required: false
    secret: true
    describes: >-
      A GitHub fine-grained access credential with Contents: Read and Write on the repository this
      installation is generated in — the WRITER.

  - name: platform_repo_read_pat
    kind: text
    required: false
    secret: true
    describes: >-
      A second GitHub credential on the same repository, with Contents: Read and no write at all —
      the READER.

  - name: catalog_repo_read_pat
    kind: text
    required: false
    secret: true
    describes: >-
      A GitHub credential with Contents: Read and no write at all, on the tenant catalog — the
      READER on the repository this machine's resident deployment service keeps its own checkout of
      the programs from. Not the writer at the foot of the credentials file, which stands on the
      same repository under its own key.

  - name: cloudflare_api_token
    kind: text
    required: false
    secret: true
    describes: >-
      A Cloudflare API token with Zone:DNS:Edit and Zone:Zone:Read, scoped to your own zone only.

  - name: storage_box_host
    kind: text
    required: false
    describes: >-
      The hostname of the Hetzner Storage Box that backups, moves and restores are written to.

  - name: storage_box_user
    kind: text
    required: false
    describes: >-
      A SUB-account of that storage box (uXXXXXX-subN), with SSH/SFTP enabled and its own
      directory. Never the main account.

  - name: storage_box_password
    kind: text
    required: false
    secret: true
    describes: >-
      The password of that storage box sub-account. Never the main account's.

  # ── only on the cluster that carries the build plane ────────────────────────
  - name: registry_dockerhub_user
    kind: text
    required: false
    describes: >-
      Build plane only: a Docker Hub username, for pulling upstream base images past the
      public-IP rate limit.

  - name: registry_dockerhub_token
    kind: text
    required: false
    secret: true
    describes: >-
      Build plane only: a READ-only Docker Hub access token.

  - name: registry_pull_user
    kind: text
    required: true
    default: platform-pull
    describes: >-
      The account every workload of this installation pulls images as.

  - name: registry_push_user
    kind: text
    required: true
    default: platform-push
    describes: >-
      The account the release pipeline pushes images as. A separate account from the one above on
      purpose: what pulls an image cannot replace it.

  - name: build_platform_repo_write_pat
    kind: text
    stated_when: {predicate: build_plane_here_in_answers}
    required: false
    secret: true
    describes: >-
      Build plane only: a GitHub credential with Contents: Read and Write on the repository this
      installation is generated in. Optional in effect on a regeneration — the seeded file already
      carries it — but stated only where this machine is the build plane, exactly as at birth.

  - name: build_manager_repo_write_pat
    kind: text
    stated_when: {predicate: build_plane_here_in_answers}
    required: false
    secret: true
    describes: >-
      Build plane only: the same, on the repository the platform's own Manager is built from.

  - name: build_catalog_repo_write_pat
    kind: text
    stated_when: {predicate: build_plane_here_in_answers}
    required: false
    secret: true
    describes: >-
      Build plane only: the same, on the tenant catalog named above.

steps:
  # The one tool this program is, asked for before anything uses it — deploy-branch's row.
  - step: require_commands
    commands: [git]
    on_failure: exit

  # The committer identity, set rather than demanded — deploy-branch's row. On a regeneration it is
  # usually already set and the row finds nothing to do.
  - step: git_identity
    repository: /srv/hostyour-cloud
    name_answer: committer_name
    email_answer: committer_email
    on_failure: exit

  # What a push is made with, deploy-branch's row again — the checkout carries no credential in its
  # remote address, and the gate below and the push at the foot of this program both ask a remote
  # for a write right that nothing granted.
  - step: git_push_credential
    repository: /srv/hostyour-cloud
    remote: origin
    # THE FILE AND NOT THE ANSWER, the opposite of deploy-branch's row and for the reason stated
    # where this program declares its credentials: on a regeneration they are all optional, because
    # the file they seed already stands on the machine, filled at birth or rotated by hand since. A
    # run that was given no credential holds no answer to read, and the value that is actually
    # correct for this machine is the one in the file.
    credential_file: /srv/hostyour-cloud/secrets/secrets.<stage>
    credential_key: GITOPS_REPO_PAT
    credential_user: x-access-token
    run_answer: stage
    on_failure: exit

  # Whether the remote would take the result, asked before any of the result exists. The branch a
  # push has to be accepted for is THIS installation's own — deploy-branch proves the product
  # branch here, because at birth that is the branch that exists; a regeneration proves the branch
  # it is about to move.
  #
  # IT DOES NOT ANSWER ON ITS OWN, which is what the line below says: the credential it presents
  # is written by the row above, and a dry run writes nothing, so in a dry run this gate cannot be
  # reached and the record stamps it declared rather than proven. A real run enforces it in full.
  # THE CHECKOUT IS PUT ON THE PUBLISHED TIP OF ITS OWN BRANCH FIRST, and without this row a
  # regeneration cannot run at all. This program is deploy-branch against an existing installation,
  # and in an installation it is deploy-host that places the checkout; here nothing does. Meanwhile
  # the branch moves without the machine: a platform release writes its `release:` line into the
  # install branch on the remote, and the manager's release writes its image pins into every branch
  # a cluster reads. So the machine stands behind its own branch, the row below refuses a push that
  # would not fast-forward, and the run stops before it has fetched anything.
  - step: git_clone
    repository: /srv/hostyour-cloud
    host: github.com
    branch_answer: fqdn
    origin_answer: platform_repo
    owner_answer: operator_user
    on_failure: exit

  - step: require_pushable_remote
    rests_on_an_earlier_step: true
    repository: /srv/hostyour-cloud
    remote: origin
    branch_answer: fqdn
    on_failure: exit

  # THE REGENERATION ITSELF: the named state merged into the branch that is checked out. Everything
  # only the branch has — the books above all — is kept; everything only that state has comes in;
  # and a conflict is resolved toward it ONLY under the paths listed on the merge, because the rows
  # below write every one of those again. Every conflict outside them stops the run with the paths
  # named, which is a machine setting that would have been overwritten saying so.
  #
  # THE STATE IS NAMED BY WHOEVER RUNS THIS, and fetched before the merge asks for it: a ref this
  # checkout has never fetched resolves to nothing, and the merge would then refuse with a message
  # about the name while the cause was only that the checkout was behind. A checkout already holding
  # it asks for nothing.
  - step: git_fetch
    rests_on_an_earlier_step: true
    repository: /srv/hostyour-cloud
    remote: origin
    tag_answer: platform_ref
    on_failure: exit

  # IT RESTS ON THE FETCH ABOVE, and saying so is what lets this program pass its own test gate. A
  # merge is asked in every mode; the fetch that brings the ref is not, because it changes the
  # checkout and therefore rests on an earlier step itself. So in test and dry the ref is not there,
  # and without this line the row refuses every time — "nothing in /srv/hostyour-cloud resolves
  # <the tag> to a commit - fetch it first" — with the tag standing on the remote all along, and no
  # regeneration ever runs through.
  - step: git_merge_ref
    rests_on_an_earlier_step: true
    repository: /srv/hostyour-cloud
    branch_answer: fqdn
    ref_answer: platform_ref
    toward_ref:
      - clusters/argocd/*
      # PATTERNS, not a roll-call. This list named nine installation/apps/<app>.yaml files, and
      # not one of them existed: the per-app values stand under installation/values/, and the
      # rename that moved them left the list behind. A pattern that matches nothing is not
      # harmless here — this is the ONLY place a conflict is resolved toward the tag, so the two
      # files a regeneration rewrites whole were the two a conflict would stop the run on.
      # One pattern per directory also means an app added later is covered without an edit here,
      # which is what a roll-call could not manage even while its names were right.
      - clusters/active/*
      - installation/values/*
    on_failure: exit

  # ── from here down, deploy-branch's own rows, unchanged ─────────────────────
  # Each finds the work the merge left it: a placeholder that came back in from the tag is stamped
  # again, a file rendered from answers is rendered again, and a row whose work survived the merge
  # finds nothing to do. The full story of every row stands beside it in deploy-branch.yaml, and
  # this file deliberately does not restate it: two copies of one paragraph drift.
  - step: stamp_placeholder_in_tracked_files
    repository: /srv/hostyour-cloud
    refuse_on_branch: master
    placeholder: example.invalid
    on_failure: exit

  # The map, rewritten from this run's answers exactly as at birth — and `release` is the carried
  # slot `<release!?>`: whatever stands there is handed back untouched, because this run does not
  # decide what a cluster's release is.
  # WHERE THIS MACHINE CAN BE REACHED, for the boundary the gate sandbox is drawn with. Measured and
  # never answered: it is a fact about the machine this run is standing on, and one mistyped octet is
  # a boundary that reports itself closed while standing open.
  #
  # THE INTERFACES NAMED HERE ARE NOT THE MACHINE'S. Each is one a container network makes on a node
  # and renumbers on its own schedule, so an address on one of them is a pod-network address the
  # fence already denies by range, and writing it into the map would make this cluster's stated
  # addresses churn on facts that are not about the machine. They are named HERE and not in the step
  # because which of them exist depends on what the machine runs, and the step runs on machines that
  # run none of it. Matched as beginnings: every one of these families numbers or hashes its own.
  - step: measure_host_addresses
    ignoring_interfaces:
      - cali
      - vxlan.calico
      - tunl
      - flannel
      - cni
      - docker
      - br-
      - veth
      - kube-ipvs
    on_failure: exit

  - step: write_file_from_template
    template: ansiwise/templates/cluster-map.tpl
    path: /srv/hostyour-cloud/clusters/active/<fqdn>.yaml
    run_answer: fqdn
    file_mode: 420
    values:
      fqdn: { answer: fqdn }
      stage: { answer: stage }
      role: { answer: role }
      books-cluster: { answer: books_fqdn }
      build-plane: { answer: build_plane_fqdn }
      unit-apex: { answer: unit_apex }
      platform-domain: { answer: platform_domain }
      cluster-issuer: { answer: cluster_issuer }
      letsencrypt-email: { answer: letsencrypt_email }
      letsencrypt-server: { answer: letsencrypt_server }
      # SEPARATED THE WAY THE TEMPLATE WRITES A LIST, and that is not the same as a comma.
      # The slot stands inside `['...']`, so a plain ", " puts BOTH mailboxes inside one pair
      # of quotes: measured, two answers render as ['a@x.ch, b@x.ch'] — one entry carrying a
      # comma, which the alert route reads as a single malformed mailbox. It is invisible today
      # only because exactly one recipient is answered.
      alert-recipients: { answer: alert_recipients, join: "', '" }
      catalog-repo: { answer: catalog_repo }
      mail-url: { answer: mail_url }
      # The short name, its two registry accounts and the two placement facts. Every one of them
      # is a slot of the template and none of them was here: the map gained them and the row that
      # fills it did not, so the run refused with the names it could not fill.
      cluster-name: { answer: cluster_name }
      registry-pull-user: { answer: registry_pull_user }
      registry-push-user: { answer: registry_push_user }
      # Read off the machine by the row above, never answered.
      node-cidrs: { measured: host_addresses }
      holds-build-plane: { answer: holds_build_plane }
      holds-books: { answer: holds_books }
    on_failure: exit

  - step: fill_key_value_file
    template_path: /srv/hostyour-cloud/configs/config.example
    path: /srv/hostyour-cloud/configs/config.<stage>
    run_answer: stage
    file_mode: 420
    subject: configuration
    values:
      DEPLOY_ENV: { answer: stage }
      CLUSTER_FQDN: { answer: fqdn }
      LETSENCRYPT_EMAIL: { answer: letsencrypt_email }
      CLUSTER_ISSUER: { answer: cluster_issuer }
      ALERT_RECIPIENTS: { answer: alert_recipients, join: "," }
      UNIT_APEX: { answer: unit_apex }
      PLATFORM_DOMAIN: { answer: platform_domain }
      # deploy-branch's row, for the reason stated there: the same answer the map's own
      # `books-cluster` is written from, so the two files cannot come to say it apart.
      BOOKS_CLUSTER: { answer: books_fqdn }
      BUILD_PLANE_FQDN: { answer: build_plane_fqdn }
      CATALOG_REPO: { answer: catalog_repo }
      # THE PROGRAMS' OWN REPOSITORY, which the row that clones the catalogue reads out of this
      # file. Beside catalog_repo and not merged with it: one names an installation's charts and
      # is private, the other names the platform's programs and is public.
      DEPLOY_REPO: { answer: deploy_repo }
    on_failure: exit

  # The two credential files, create-only per key: what the machine already holds is kept, and an
  # answer this run was not given fills nothing. That is what makes the credential answers above
  # optional here.
  - step: fill_key_value_file
    template_path: /srv/hostyour-cloud/secrets/secrets.example
    path: /srv/hostyour-cloud/secrets/secrets.<stage>
    run_answer: stage
    file_mode: 384
    subject: credentials
    holds_credentials: true
    values:
      GITOPS_REPO_PAT: { answer: platform_repo_write_pat }
      GITOPS_REPO_READ_PAT: { answer: platform_repo_read_pat }
      CATALOG_REPO_READ_PAT: { answer: catalog_repo_read_pat }
      CLOUDFLARE_API_TOKEN: { answer: cloudflare_api_token }
      STORAGE_BOX_HOST: { answer: storage_box_host }
      STORAGE_BOX_USER: { answer: storage_box_user }
      STORAGE_BOX_PASSWORD: { answer: storage_box_password }
    on_failure: exit

  - step: fill_key_value_file
    template_path: /srv/hostyour-cloud/secrets/secrets.example
    path: /srv/hostyour-cloud/secrets/secrets.<stage>
    run_answer: stage
    file_mode: 384
    subject: build plane credentials
    holds_credentials: true
    values:
      REGISTRY_PULL_USER: { answer: registry_pull_user }
      REGISTRY_PUSH_USER: { answer: registry_push_user }
      REGISTRY_DOCKERHUB_USER: { answer: registry_dockerhub_user }
      REGISTRY_DOCKERHUB_TOKEN: { answer: registry_dockerhub_token }
      BUILD_HOSTYOUR_CLOUD_REPO_PAT: { answer: build_platform_repo_write_pat }
      BUILD_HOSTYOUR_MANAGER_REPO_PAT: { answer: build_manager_repo_write_pat }
      BUILD_CATALOG_REPO_PAT: { answer: build_catalog_repo_write_pat }
    on_failure: exit

  - step: stamp_placeholder_in_tracked_files
    repository: /srv/hostyour-cloud
    refuse_on_branch: master
    placeholder: __CLUSTER_NAME__
    value_answer: cluster_name
    tree: clusters/bootstrap
    on_failure: exit

  - step: stamp_placeholder_in_tracked_files
    repository: /srv/hostyour-cloud
    refuse_on_branch: master
    placeholder: __BOOKS_NAME__
    value_answer: books_name
    tree: clusters/bootstrap
    on_failure: exit

  # WHICH AUTHORITY EVERY CERTIFICATE OF THIS INSTALLATION IS ISSUED BY, on a regeneration as well
  # as at birth, and written rather than stamped for the reason deploy-branch states: a stamp fills
  # a placeholder once and finds nothing to replace afterwards, so an installation that names a
  # different authority later keeps the old name and nothing is ever re-issued.
  - step: write_value_in_branch_file
    repository: /srv/hostyour-cloud
    path: clusters/platform/values-common.yaml
    # THE PATH AND NOT THE BARE NAME. The key stands under `global:`, and a bare name is looked for
    # at the head of a line — where this one is not. Written bare, the writer finds nothing and
    # appends a SECOND clusterIssuer at the top of the file, with every chart still reading the
    # nested one and the run reporting itself green.
    key: global.clusterIssuer
    value_answer: cluster_issuer
    # 420 — the values chain is read by the reconciler and by every chart rendered from it.
    file_mode: 420
    on_failure: exit

  - step: write_file_from_template
    template: ansiwise/templates/base-certificate.tpl
    path: /srv/hostyour-cloud/clusters/bootstrap/vault/certificate.yaml
    file_mode: 420
    values:
      cluster-issuer: { answer: cluster_issuer }
      fqdn: { answer: fqdn }
    on_failure: exit

  # THE MANAGER'S OWN TWO SETTINGS, written on a regeneration as well as at birth. Written only
  # at birth, an installation that already stands never gains the file at all — its Manager goes
  # on answering 501 to every mutating consumer route, and the reason is a file nobody looks for.
  # The two facts are the account that operates the machine and its address on the cluster network,
  # which a platform release does not change; what changes is whether the installation has them.
  - step: write_file_from_template
    template: ansiwise/templates/manager-values.tpl
    path: /srv/hostyour-cloud/installation/values/manager.yaml
    # 420 — the reconciler's render reads this file.
    file_mode: 420
    values:
      operator-user: { answer: operator_user }
      lan-host: { answer: lan_host }
    on_failure: exit

  - step: write_file_from_template
    template: ansiwise/templates/postfix-values.tpl
    path: /srv/hostyour-cloud/installation/values/postfix.yaml
    file_mode: 420
    values:
      platform-domain: { answer: platform_domain }
      unit-apex: { answer: unit_apex }
    on_failure: exit

  # What the stamps and renders changed on top of the merge, recorded — the merge commit itself was
  # already made by the merge row. The paths are deploy-branch's own.
  # THE INPUT THIS INSTALLATION'S OWN UNIT IS HANDED, recorded with everything else the branch
  # states about itself. It carries the installation's domain and its stage and nothing else, so
  # there is nothing here that may not stand in a repository.
  #
  # IT IS WRITTEN HERE AND NOT WHERE THE UNIT IS INSTALLED. deploy-platform-services has no git row
  # at all - it reads this branch, it does not write it - so a file written there is one the commit
  # below never carries: untracked in the checkout for ever, and a regeneration refuses to merge over
  # a working tree that is not clean, so no later fix reaches the machine at all.
  #
  # NO CONDITION ON IT. The two gates that would fit here guard the UNIT - a cluster with no secret
  # store installs none. The file is two values either way, and a machine that never starts the unit
  # is not harmed by a file it does not read.
  - step: write_file_from_template
    template: ansiwise/templates/vault-unseal-answers.tpl
    path: /srv/hostyour-cloud/configs/unseal-vault-answers.json
    file_mode: 384
    values:
      fqdn: { answer: fqdn }
      stage: { answer: stage }
    on_failure: exit

  - step: git_commit
    repository: /srv/hostyour-cloud
    paths: [clusters, configs, installation]
    message: "Regenerate this installation at the product state it was brought to"
    on_failure: exit

  # And sent — a plain push, because a merge keeps the history and nothing is rewritten.
  - step: git_push
    repository: /srv/hostyour-cloud
    remote: origin
    on_failure: exit
