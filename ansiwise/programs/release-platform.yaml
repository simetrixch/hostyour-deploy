# Cutting a release of the platform.
#
# WHAT A PLATFORM RELEASE IS. The platform repository builds nothing: no image, no archive, no
# package. The TREE AT THE TAG is the release, and an installation is regenerated from exactly that
# tree. So cutting one is a single act — putting one annotated tag on one commit and pushing it —
# and everything else a release seems to involve is somebody else's job afterwards.
#
# WHAT THIS PROGRAM DOES NOT DO, on purpose. It does not pin any installation to the tag it cuts.
# That is release-cluster's, one installation at a time, because which cluster follows which release
# is a decision per cluster and never a consequence of a tag existing. A release nobody has pinned
# anything to is a normal and correct state: it is a tree somebody may choose later.
#
# WHERE THIS RUNS: on the workstation that holds the platform checkout, never on a cluster machine —
# which is what the role below pins. Invoke it dry first:
#
#   ansiwise release-platform --role workstation --mode dry --answers <file>
#   ansiwise release-platform --role workstation --mode run --answers <file>
#
# THE CHECKOUT IS BROUGHT LEVEL FIRST, by a row rather than by an operator remembering. The tag is
# put on what `origin/master` resolves to IN THIS CHECKOUT, and one that has not fetched resolves
# that name to whatever it last saw — so the tag would name a tree that is not the published one,
# and nothing anywhere would say so.
#
# THE STAMP IS ANSWERED AND NOT READ FROM A CLOCK. Fourteen digits of a UTC yyyyMMddHHmmss, composed
# once by whoever starts the run: a value read from the clock inside a step would differ between the
# mode that says what would change and the mode that changes things, and the announcement would name
# a tag that never comes into being.
name: release-platform
roles: [workstation]

answers:
  - name: platform_checkout
    kind: text
    describes: >-
      The path of the platform checkout (hostyour-cloud) on this workstation — the tree the tag is
      put in, and the tree the tag then names.

  - name: release_version
    kind: text
    describes: >-
      The three numbers of this release, as major.minor.patch. EVERY RELEASE IS A PATCH BUMP: the
      first two numbers stay where they are, whatever the release contains, because the version says
      which tree is running and makes no claim about the product. Who moves the first two is the
      product owner, when the product reaches something worth a number.

  - name: release_channel
    kind: text
    describes: >-
      The channel this release is cut on, and it is a CEILING rather than a deployment: alpha
      reaches dev, beta reaches dev and test, stable reaches everywhere. Nothing here enforces that
      ceiling — it is enforced where deployments are written.

  - name: release_stamp
    kind: text
    describes: >-
      Fourteen digits of a UTC yyyyMMddHHmmss, which make two releases of one version tell each
      other apart. Composed by whatever starts this run, once, so that all three modes compose the
      same tag.

steps:
  # WHO THE TAG IS ANNOTATED BY IS THE WORKSTATION'S OWN SETTING, and no row here sets it. Every
  # other program of this repository configures an identity because it works on a machine it just
  # installed, where none is configured; a workstation somebody cuts releases from has one, and it
  # is the one that should stand on the tag. Where it does not, git refuses the annotation itself
  # and says which of the two values it is missing — a better message than any this file could give.
  - step: require_commands
    commands: [git]
    on_failure: exit

  # WHAT IS RELEASED IS WHAT THE REMOTE PUBLISHES, and this row is what makes that true rather than
  # hoped for. It asks the remote where master stands and brings this checkout's own name for it
  # level; a checkout already level asks for nothing.
  - step: git_fetch
    repository_answer: platform_checkout
    remote: origin
    branch: master
    on_failure: exit

  # The tag, composed from the three answers above and nothing else. This row is where the grammar
  # lives: a product that changes its channels changes the list here, and every program that cuts a
  # release follows.
  - step: measure_release_tag
    version_answer: release_version
    channel_answer: release_channel
    stamp_answer: release_stamp
    channels: [alpha, beta, stable]
    on_failure: exit

  # ONE ACT, and the whole release. `origin/master` and not `master`: what is released is what the
  # remote publishes, and a local branch may be ahead of it with commits nobody else has — a tag on
  # one of those names a tree no installation could ever fetch.
  - step: git_tag
    rests_on_an_earlier_step: true
    # THE ANSWER AND NOT A PATH. Where this checkout stands is a fact of one workstation, so a path
    # written here would be right on the machine it was written on and wrong on the next one.
    repository_answer: platform_checkout
    tag:
      measured: release_tag
    ref: origin/master
    message: the platform, cut as a release
    remote: origin
    on_failure: exit
