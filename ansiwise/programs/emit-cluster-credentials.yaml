# The ONE cross-cluster credential handshake of adding a slave, run ON THE SLAVE: the two
# management accounts the master will drive this cluster through are created here, and what they
# hand out — a registration token, a reviewing token, the cluster authority — leaves the machine
# through one file the caller reads, carries to register-slave on the master, and removes.
#
# WHY THE SLAVE'S OWN SIDE EXISTS AT ALL. The master deploys onto this cluster and validates this
# cluster's logins, and both need a credential minted BY this cluster: a registration token the
# reconciler bears, and a reviewing token the secret store presents to this cluster's own token
# review. Neither can be minted anywhere else, and this machine's GitOps cannot mint them either —
# its GitOps only starts once the registration these tokens make possible exists. So this is the
# pre-GitOps surface of a slave, one program long.
#
# HOW THE VALUES REACH THE MASTER: through the file alone, readable by the operating account only —
# the same doctrine as the tailnet join key. A run's record keeps output, and the registration
# token is cluster-admin here: a leaked file is remote control of this cluster, so it is never an
# output line, never an argument, and the caller removes it once register-slave holds the values.
#
# THE ADDRESS IS STATED, NEVER GUESSED. The file carries the address the MASTER dials this
# cluster's API on — its private-network address once the two share one — and this machine cannot
# know which of its addresses that is. The caller states it, and states the SAME address to
# register-slave and into the cluster map, so every reader of this cluster's address holds one
# spelling. An interface scan guessing it here dies on every joined machine, for exactly that
# reason.
name: emit-cluster-credentials
roles: [slave]
defaults:
  # How the cluster client is invoked on this platform's machines, and that it answers root alone —
  # the same two facts every program of this catalogue states.
  kubectl: [microk8s, kubectl]
  kubectl_needs_root: true
steps:
  # THE TOOL FIRST, AND THIS ONLY MEASURES. The cluster program put it here; a machine missing it
  # must be named as such rather than surfacing as an apply failing strangely.
  - step: require_commands
    commands: [microk8s]
    on_failure: exit

  # The accounts, their grants and their long-lived token Secrets, rendered from the template
  # beside this file — every name in it is a platform contract the template's own header explains.
  # Rendered to a scratch path: the manifest carries no value of this run and no secret, only the
  # shape the cluster then fills tokens into.
  - step: write_file_from_template
    template: ansiwise/templates/cluster-management-accounts.tpl
    path: /tmp/ansiwise-cluster-management-accounts.yaml
    file_mode: 420
    on_failure: exit

  - step: kubernetes_object_reversible
    rests_on_an_earlier_step: true
    repository: /tmp
    manifest: ansiwise-cluster-management-accounts.yaml
    on_failure: exit

  # The harvest. The step waits, bounded, for the cluster's own controller to populate the two
  # token Secrets, then writes ONE file: server (the stated address), caData (the cluster
  # authority), argocdToken (the registration credential) and reviewerToken (the reviewing
  # credential) — the four values register-slave takes as its answers, under these very names.
  - step: export_cluster_credentials
    rests_on_an_earlier_step: true
    namespace: kube-system
    tokens:
      - argocdToken=argocd-manager-token
      - reviewerToken=vault-token-reviewer-token
    server_answer: api_server_url
    file_path: /tmp/ansiwise-cluster-credentials
    on_failure: exit

answers:
  - name: api_server_url
    kind: text
    describes: >-
      The address the MASTER's in-cluster components dial this cluster's API server on, scheme and
      port included — https://, the address, and :16443 for this platform's distribution. On a
      machine outside the master's own network that is its private-network address. Stated, never
      guessed: this machine cannot know which of its addresses the master routes to, and the same
      spelling goes to register-slave and into the cluster map, so every reader holds one address.
